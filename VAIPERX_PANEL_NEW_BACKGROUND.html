window.addEventListener("load",()=>setTimeout(()=>document.getElementById("loading").classList.add("hide"),1700));
const particles=document.getElementById("particles");
for(let i=0;i<40;i++){const p=document.createElement("i");p.className="particle";p.style.left=(Math.random()*100)+"%";p.style.animationDuration=(5+Math.random()*9)+"s";p.style.animationDelay=(Math.random()*8)+"s";particles.appendChild(p)}

function clickSound(){if(!soundOn)return;try{audioCtx ||= new(window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type="square";o.frequency.setValueAtTime(520,audioCtx.currentTime);o.frequency.exponentialRampToValueAtTime(180,audioCtx.currentTime+.07);g.gain.setValueAtTime(.035,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.08);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.08)}catch(e){}}
const soundBtn=document.getElementById("soundBtn");soundBtn.onclick=()=>{soundOn=!soundOn;soundBtn.innerHTML=soundOn?"🔊 SOUND <span>ON</span>":"🔇 SOUND <span>OFF</span>";clickSound()};
const toast=document.getElementById("toast");
document.querySelectorAll(".menu-btn").forEach(btn=>{btn.onclick=e=>{e.preventDefault();clickSound();const url=LINKS[btn.dataset.key];if(!url||url.includes("example.com")){toast.textContent="กรุณาใส่ลิงก์จริงใน const LINKS";toast.classList.add("show");setTimeout(()=>toast.classList.remove("show"),2200);return}btn.style.transform="scale(.965)";setTimeout(()=>btn.style.transform="",140);window.open(url,"_blank","noopener")}});
