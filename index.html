<!DOCTYPE html>
<html lang="th">
<head>

<style>
@import url('https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Orbitron:wght@500;600;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--red:#ff2538;--red2:#ff5a67;--red-soft:rgba(255,37,56,.18);--ink:#050609;--panel:rgba(12,13,17,.78);--line:rgba(255,90,103,.42)}
html,body{min-height:100%;background:#030407}
body{font-family:'Kanit','Plus Jakarta Sans',sans-serif;color:#fff;overflow-x:hidden;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,a{font-family:inherit}
.page{position:relative;min-height:100svh;overflow:hidden;background:#030407}
.page:after{content:"";position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(circle at 50% 15%,rgba(255,37,56,.12),transparent 34%),linear-gradient(180deg,rgba(0,0,0,.12),rgba(0,0,0,.48))}
.particles{position:fixed;inset:0;z-index:2;pointer-events:none}
.particle{position:absolute;bottom:-8px;width:2px;height:2px;border-radius:50%;background:#ff4b5c;box-shadow:0 0 8px #ff2538;animation:floatUp linear infinite}
@keyframes floatUp{0%{transform:translate3d(0,10px,0);opacity:0}12%{opacity:.75}88%{opacity:.35}100%{transform:translate3d(20px,-105svh,0);opacity:0}}
#loading{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:#030407;transition:opacity .55s,visibility .55s}
#loading.hide{opacity:0;visibility:hidden;pointer-events:none}
.loader{text-align:center;width:min(76vw,330px)}
.loader-logo{font:800 clamp(48px,15vw,78px)/.8 'Plus Jakarta Sans',sans-serif;font-style:italic;letter-spacing:-4px;color:#f4f4f5;text-shadow:0 0 18px rgba(255,255,255,.25),0 0 36px rgba(255,37,56,.4)}
.loader-logo span{color:var(--red);text-shadow:0 0 14px var(--red),0 0 34px rgba(255,37,56,.55)}
.loader-sub{margin-top:14px;font:600 9px Orbitron,sans-serif;letter-spacing:3px;color:#a9adb6}
.loader-bar{height:3px;margin-top:22px;background:#17191f;border-radius:99px;overflow:hidden;box-shadow:0 0 18px rgba(255,37,56,.18)}
.loader-bar i{display:block;width:0;height:100%;background:linear-gradient(90deg,#8d111d,var(--red2));box-shadow:0 0 14px var(--red);animation:load 1.7s forwards}
@keyframes load{to{width:100%}}
.app{position:relative;z-index:5;width:min(100%,760px);margin:auto;min-height:100svh;padding:18px 16px 24px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.badge,.sound{border:1px solid var(--line);background:linear-gradient(135deg,rgba(20,21,27,.9),rgba(7,8,11,.72));box-shadow:0 10px 30px rgba(0,0,0,.28),inset 0 0 20px rgba(255,37,56,.05);border-radius:14px;padding:9px 13px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.badge b{font:700 10px 'Plus Jakarta Sans',sans-serif;letter-spacing:1.4px}.badge small{display:block;margin-top:4px;color:#65e99a;font:600 7px Orbitron,sans-serif;letter-spacing:1.3px}
.sound{color:#e9ebef;font:700 9px 'Plus Jakarta Sans',sans-serif;letter-spacing:1px;cursor:pointer}.sound span{color:var(--red2)}
.hero{position:relative;text-align:center;padding:20px 0 26px}
.hero:before{content:"";position:absolute;left:50%;top:0;transform:translateX(-50%);width:min(92vw,430px);height:180px;background:radial-gradient(ellipse,rgba(255,37,56,.13),transparent 68%);filter:blur(8px);pointer-events:none}
.hero-emblem{position:absolute;left:50%;top:2px;transform:translateX(-50%);width:min(78vw,300px);height:170px;border:1px solid rgba(255,37,56,.13);border-radius:50%;box-shadow:0 0 50px rgba(255,37,56,.08);pointer-events:none}
.hero-emblem:before{content:"";position:absolute;inset:18px;border:1px dashed rgba(255,90,103,.14);border-radius:50%}
.logo{position:relative;z-index:3;font:800 clamp(58px,16vw,108px)/.78 'Plus Jakarta Sans',sans-serif;font-style:italic;letter-spacing:-5px;background:linear-gradient(180deg,#fff 0%,#f1f2f4 35%,#8e929a 62%,#fff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:1px rgba(255,255,255,.65);filter:drop-shadow(0 8px 8px rgba(0,0,0,.55)) drop-shadow(0 0 28px rgba(255,37,56,.3))}
.logo span{color:var(--red);-webkit-text-stroke:1px #ff8992;text-shadow:2px 4px 0 #420910,0 0 15px rgba(255,37,56,.9),0 0 34px rgba(255,37,56,.55)}
.tagline{position:relative;z-index:3;margin-top:17px;font:700 clamp(8px,2.2vw,11px) Orbitron,sans-serif;letter-spacing:2.8px;color:#b7bac2;text-shadow:0 0 10px rgba(255,255,255,.12)}.tagline span{color:var(--red2);text-shadow:0 0 12px rgba(255,37,56,.8)}
.menu{display:flex;flex-direction:column;gap:12px}
.menu-btn{position:relative;display:flex;align-items:center;width:100%;min-height:104px;padding:11px 13px;text-decoration:none;color:#fff;background:linear-gradient(110deg,rgba(22,10,13,.88),rgba(10,12,16,.86) 32%,rgba(8,9,13,.9));border:1px solid rgba(255,72,86,.55);border-radius:22px;box-shadow:0 14px 35px rgba(0,0,0,.32),0 0 18px rgba(255,37,56,.08),inset 0 0 28px rgba(255,37,56,.045);overflow:hidden;isolation:isolate;transition:transform .22s ease,border-color .22s ease,box-shadow .22s ease,background .22s ease}
.menu-btn:before{content:"";position:absolute;inset:1px;border:1px solid rgba(255,255,255,.05);border-radius:21px;pointer-events:none}
.menu-btn:after{content:"";position:absolute;top:-20%;left:-65%;width:38%;height:140%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.09),transparent);transform:skewX(-18deg);animation:shine 6s ease-in-out infinite;pointer-events:none}
.menu-btn:hover{transform:translateY(-3px);border-color:rgba(255,100,112,.82);background:linear-gradient(110deg,rgba(32,11,15,.94),rgba(13,14,19,.92));box-shadow:0 18px 42px rgba(0,0,0,.4),0 0 28px rgba(255,37,56,.18),inset 0 0 35px rgba(255,37,56,.08)}
.menu-btn:active{transform:scale(.975)}
@keyframes shine{0%,55%{left:-65%;opacity:0}65%{opacity:1}80%,100%{left:135%;opacity:0}}
.scanline{position:absolute;left:12%;right:12%;top:0;height:1px;background:linear-gradient(90deg,transparent,var(--red2),transparent);box-shadow:0 0 8px var(--red);animation:scan 3.2s linear infinite;z-index:4}
@keyframes scan{0%{transform:translateX(-40%);opacity:0}35%{opacity:.8}100%{transform:translateX(40%);opacity:0}}
.energy{position:absolute;right:24px;top:11px;width:30px;height:2px;background:var(--red);box-shadow:0 0 8px var(--red);animation:energy 2s ease-in-out infinite;z-index:4}
@keyframes energy{0%,100%{transform:scaleX(.45);opacity:.25}50%{transform:scaleX(1);opacity:1}}
.icon-box{position:relative;z-index:2;flex:0 0 84px;height:72px;margin-right:15px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,rgba(255,37,56,.16),rgba(8,9,12,.86) 72%);border:1px solid rgba(255,80,94,.48);border-radius:18px;box-shadow:inset 0 0 22px rgba(255,37,56,.08),0 8px 20px rgba(0,0,0,.22)}
.icon-box:before{content:"";position:absolute;inset:5px;border:1px solid rgba(255,255,255,.07);border-radius:14px}
.social-icon{position:relative;z-index:2;width:42px;height:42px;color:#ff4b5c;filter:drop-shadow(0 0 6px rgba(255,37,56,.7));transition:transform .22s,color .22s,filter .22s}
.menu-btn:hover .social-icon{transform:scale(1.1);color:#ff7b87;filter:drop-shadow(0 0 7px #fff) drop-shadow(0 0 18px var(--red))}
.text-area{position:relative;z-index:2;flex:1;min-width:0;text-align:center;padding:0 4px}
.main-text{font:700 clamp(23px,6vw,38px)/1.15 Kanit,sans-serif;letter-spacing:-.2px;color:#f6f7f8;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.sub-text{margin-top:7px;font:600 8px Orbitron,sans-serif;letter-spacing:2.1px;color:#ff6975;text-shadow:0 0 9px rgba(255,37,56,.55)}
.arrow{position:relative;z-index:2;flex:0 0 38px;text-align:center;font:300 43px/1 Arial,sans-serif;color:#ff5361;text-shadow:0 0 9px rgba(255,37,56,.7);transition:.2s}.menu-btn:hover .arrow{transform:translateX(5px);color:#fff}
.footer{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:52px;margin-top:16px;padding:0 16px;border:1px solid rgba(255,72,86,.35);background:rgba(7,8,11,.78);border-radius:15px;box-shadow:0 10px 30px rgba(0,0,0,.28),inset 0 0 20px rgba(255,37,56,.04);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.footer span{font:600 7px Orbitron,sans-serif;letter-spacing:1.3px;color:#9297a1}.footer-logo{font:800 italic 20px 'Plus Jakarta Sans',sans-serif;color:var(--red2);text-shadow:0 0 13px rgba(255,37,56,.75)}
.scroll{margin-top:13px;text-align:center;font:600 7px Orbitron,sans-serif;letter-spacing:2.8px;color:#8f939d}.scroll i{display:block;font:28px Arial,sans-serif;color:#ff5361;animation:down 1.3s infinite;text-shadow:0 0 12px var(--red)}@keyframes down{50%{transform:translateY(5px)}}
.toast{position:fixed;left:50%;bottom:18px;z-index:50;transform:translate(-50%,20px);opacity:0;pointer-events:none;padding:10px 16px;border:1px solid rgba(255,80,94,.65);border-radius:12px;background:rgba(11,12,16,.96);font:500 12px Kanit,sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.4),0 0 22px rgba(255,37,56,.18);transition:.25s;white-space:nowrap;backdrop-filter:blur(14px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:480px){.app{padding:12px 11px 18px}.badge,.sound{padding:8px 10px;border-radius:12px}.badge b{font-size:8px}.badge small{font-size:5.5px}.sound{font-size:8px}.hero{padding:17px 0 23px}.logo{letter-spacing:-4px}.menu{gap:10px}.menu-btn{min-height:91px;padding:9px 10px;border-radius:18px}.menu-btn:before{border-radius:17px}.icon-box{flex-basis:68px;height:64px;margin-right:8px;border-radius:15px}.icon-box:before{border-radius:11px}.social-icon{width:35px;height:35px}.main-text{font-size:23px}.sub-text{font-size:6.5px;letter-spacing:1.25px}.arrow{flex-basis:28px;font-size:38px}.footer{min-height:45px;padding:0 10px;border-radius:12px}.footer span{font-size:5.5px}.footer-logo{font-size:17px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
</style>
</head>
